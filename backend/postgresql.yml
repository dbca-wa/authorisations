services:
  postgresql:
    image: postgres:17-alpine
    container_name: authorisations_psql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./init-database.sh:/docker-entrypoint-initdb.d/init-database.sh
      - authorisations_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  authorisations_postgres_data:
    driver: local
    name: authorisations_postgres_data
